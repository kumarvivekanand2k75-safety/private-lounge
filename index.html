<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Lounge</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .lounge {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    .lounge h1 {
      margin-bottom: 10px;
    }

    .lounge p {
      color: #666;
      margin-bottom: 25px;
    }

    .login-box {
      max-width: 400px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #privateContent {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #f0fdf4;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h2>Private Lounge</h2>
    <p>Welcome to the Private Area</p>
  </header>

  <div class="container">

    <div class="lounge">

      <h1>🔐 Private Lounge</h1>

      <p>
        Please enter your login details to access the private area.
      </p>

      <div class="login-box">

        <input
          type="text"
          id="username"
          placeholder="Enter Username"
        >

        <input
          type="password"
          id="password"
          placeholder="Enter Password"
        >

        <button onclick="login()">
          Login
        </button>

        <p id="message"></p>

      </div>

      <div id="privateContent">

        <h2>Welcome! 🎉</h2>

        <p>
          You have successfully entered the Private Lounge.
        </p>

        <button onclick="logout()">
          Logout
        </button>

      </div>

    </div>

  </div>

  <footer>
    © 2026 Private Lounge
  </footer>

  <script>

    function login() {

      const username =
        document.getElementById("username").value;

      const password =
        document.getElementById("password").value;

      /*
       * Demo login only.
       * Do NOT use real passwords here.
       */

      if (username === "admin" && password === "1234") {

        document.querySelector(".login-box").style.display = "none";

        document.getElementById("privateContent").style.display = "block";

        document.getElementById("message").innerText = "";

      } else {

        document.getElementById("message").innerText =
          "Invalid username or password.";

      }

    }

    function logout() {

      document.querySelector(".login-box").style.display = "block";

      document.getElementById("privateContent").style.display = "none";

      document.getElementById("username").value = "";

      document.getElementById("password").value = "";

    }

  </script>

</body>
</html>
