<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    #gate {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
    }

    .box {
      background: #222;
      padding: 40px 25px;
      border-radius: 20px;
      width: 80%;
      max-width: 400px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="gate">

  <div class="box">

    <h1>18+</h1>

    <h2>Private Lounge</h2>

    <p>This website is intended for adults 18 and over.</p>

    <button onclick="enterSite()">
      I am 18+ — Enter
    </button>

    <button onclick="leaveSite()">
      Leave
    </button>

  </div>

</div>

<h1>WEBSITE OPENED</h1>

<script>

function enterSite() {
  document.getElementById("gate").style.display = "none";
}

function leaveSite() {
  window.location.href = "https://www.google.com/";
}

</script>

</body>
</html>
